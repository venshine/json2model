name: Pages

# 构建 sample/ 的 Flutter Web Playground 并发布到 GitHub Pages
# PR 上只跑 build（analyze、test、构建），不部署
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'sample/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'sample/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# 按分支分组：main 上新的推送取消还没完成的旧部署，PR 之间互不影响，也不会取消 main 的部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      # Pages 地址是 /json2model/ 子路径
      - run: flutter build web --release --base-href /json2model/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: sample/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # 只有部署任务拿 Pages 写权限
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
